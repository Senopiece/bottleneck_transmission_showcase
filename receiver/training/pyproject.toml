[project]
name = "receiver-training"
version = "0.1.0"
description = "Training entry points for receiver tracker, LED reader, and future neural BP models"
requires-python = ">=3.11"
dependencies = [
    "receiver-tools",
    "numpy>=2.0.0",
    "opencv-python>=4.10.0.84,<5",
    "onnx>=1.16.0",
    "torch>=2.3.0",
    "tqdm>=4.66.0",
    "onnxscript>=0.7.1",
]

[tool.uv]
package = false

[tool.uv.sources]
receiver-tools = { path = "../tools", editable = true }
