[project]
name = "receiver-tools"
version = "0.1.0"
description = "Dataset, overlay, trace, and evaluation tools for the optical receiver"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0.0",
    "opencv-python>=4.10.0.84,<5",
    "tqdm>=4.66.0",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["."]
include = ["receiver_tools*"]
