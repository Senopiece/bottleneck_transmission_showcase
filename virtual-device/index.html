<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>5-bit optical device</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #000;
      --fg: #f6f7f9;
      --muted: #a8adb7;
      --line: #2f343c;
      --matrix-bg-start: rgba(255,255,255,0.045);
      --matrix-bg-end: rgba(255,255,255,0.012);
      --matrix-inset: rgba(255,255,255,0.02);
      --kbd-fg: #b7bcc5;
      --kbd-bg: #090a0c;
      --kbd-border: #343941;
      --kbd-border-bottom: #242830;
      --blue: #67a8ff;
      --blue-off: rgba(103,168,255,0.11);
      --blue-glow: rgba(103,168,255,0.54);
      --arrow: #626975;
      --led: 3mm;
      --gap: 2.5mm;
      --marker: 4mm;
      --marker-gap: 4mm;
      --pad-x: 7mm;
      --pad-y: 7mm;
      --step: calc(var(--led) + var(--gap));
      --target-width: calc(var(--pad-x) * 2 + var(--marker) * 2 + var(--marker-gap) * 2 + var(--led) * 5 + var(--gap) * 4);
      --target-height: calc(var(--pad-y) * 2 + var(--marker));
      --led-y: calc(var(--target-height) / 2);
      --start-marker-x: calc(var(--pad-x) + var(--marker) / 2);
      --first-led-x: calc(var(--pad-x) + var(--marker) + var(--marker-gap) + var(--led) / 2);
      --end-marker-x: calc(var(--first-led-x) + var(--step) * 4 + var(--led) / 2 + var(--marker-gap) + var(--marker) / 2);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 320px;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
      font-weight: 680;
      letter-spacing: 0;
    }

    .stage {
      display: grid;
      place-items: center;
      min-width: 0;
      padding: 32px;
    }

    .panel {
      min-height: 100vh;
      padding: 28px;
      border-left: 1px solid var(--line);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .sub {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .controls {
      display: grid;
      gap: 16px;
    }

    .actions {
      display: grid;
      gap: 10px;
    }

    .device {
      width: var(--target-width);
      height: var(--target-height);
      position: relative;
      flex: none;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, var(--matrix-bg-start), var(--matrix-bg-end));
      border-radius: 8px;
      box-shadow: inset 0 0 0 1px var(--matrix-inset);
    }

    .led {
      width: var(--led);
      height: var(--led);
      position: absolute;
      left: calc(var(--first-led-x) + var(--index) * var(--step));
      top: var(--led-y);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: var(--blue);
      box-shadow:
        0 0 2.2mm var(--blue-glow),
        0 0 5.6mm rgba(103,168,255,0.24);
      z-index: 2;
    }

    .led[data-on="0"] {
      background: var(--blue-off);
      box-shadow: none;
    }

    .marker.start {
      width: calc(var(--led) + 0.45mm);
      height: calc(var(--led) + 0.45mm);
      position: absolute;
      left: var(--start-marker-x);
      top: var(--led-y);
      transform: translate(-50%, -50%);
      background: var(--arrow);
      border-radius: 0.2mm;
      z-index: 1;
    }

    .marker.end {
      width: calc(var(--led) + 2mm);
      height: calc(var(--led) + 2mm);
      position: absolute;
      left: var(--end-marker-x);
      top: var(--led-y);
      transform: translate(-50%, -50%);
      z-index: 1;
      fill: var(--arrow);
    }

    button,
    input {
      height: 38px;
      border: 1px solid var(--kbd-border);
      border-bottom-color: var(--kbd-border-bottom);
      border-radius: 6px;
      background: var(--kbd-bg);
      color: var(--kbd-fg);
      font: inherit;
    }

    button {
      padding: 0 12px;
      font-weight: 650;
      cursor: pointer;
    }

    input {
      width: 100%;
      padding: 0 10px;
    }

    .compact {
      display: grid;
      gap: 8px;
    }

    .compact label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }

    .primary {
      border-color: var(--kbd-border);
      background: var(--kbd-bg);
      color: var(--fg);
    }

    .message-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 4px;
      width: min(100%, 216px);
    }

    .pixel {
      aspect-ratio: 1;
      border: 1px solid var(--kbd-border);
      border-radius: 3px;
      background: #07080a;
      cursor: crosshair;
    }

    .pixel[data-on="1"] {
      background: var(--fg);
    }

    @media (max-width: 760px) {
      main {
        grid-template-columns: 1fr;
      }

      .stage {
        min-height: 58vh;
      }

      .panel {
        min-height: auto;
        border-left: 0;
        border-top: 1px solid var(--line);
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="stage" aria-label="virtual optical target">
      <div class="device" aria-label="5-bit LED grid">
        <i class="marker start" aria-hidden="true"></i>
        <i class="led" data-bit="4" data-on="1" style="--index: 0"></i>
        <i class="led" data-bit="3" data-on="0" style="--index: 1"></i>
        <i class="led" data-bit="2" data-on="1" style="--index: 2"></i>
        <i class="led" data-bit="1" data-on="0" style="--index: 3"></i>
        <i class="led" data-bit="0" data-on="1" style="--index: 4"></i>
        <svg class="marker end" viewBox="0 0 12 12" aria-hidden="true">
          <polygon points="6 2 10 10 2 10"></polygon>
        </svg>
      </div>
    </section>

    <aside class="panel">
      <header>
        <h1>Virtual Device</h1>
      </header>

      <section class="controls">
        <div class="compact">
          <label for="fps">rate</label>
          <input id="fps" type="number" min="1" max="30" value="4">
        </div>

        <div class="actions">
          <button class="primary" id="play" type="button">Start</button>
        </div>

        <div class="compact">
          <label>message</label>
          <div class="message-grid" id="messageGrid" aria-label="6 by 6 binary message"></div>
        </div>
      </section>

      <output id="binaryOut" hidden>00000</output>
    </aside>
  </main>

  <script>
    const leds = [...document.querySelectorAll(".led")];
    const fps = document.getElementById("fps");
    const play = document.getElementById("play");
    const messageGrid = document.getElementById("messageGrid");
    const binaryOut = document.getElementById("binaryOut");

    const PREAMBLE = ["00000", "01010", "10101", "11111"];
    const MESSAGE_BITS = 36;
    const PARITY_BITS = 24;
    const CODEWORD_BITS = MESSAGE_BITS + PARITY_BITS;
    const PACKET_BITS = 5;
    const PACKET_COUNT = CODEWORD_BITS / PACKET_BITS;
    const pixels = new Array(MESSAGE_BITS).fill(false);

    let bits = "00000";
    let timer = null;
    let nextIndex = 0;
    let txPackets = [];

    function normalize(value) {
      return String(value).replace(/[^01]/g, "").padEnd(5, "0").slice(0, 5);
    }

    function messageBits() {
      return pixels.map((on) => on ? "1" : "0").join("");
    }

    function parityGroup(index) {
      return [
        (index * 5) % MESSAGE_BITS,
        (index * 5 + 7) % MESSAGE_BITS,
        (index * 5 + 13) % MESSAGE_BITS,
        (index * 5 + 23) % MESSAGE_BITS,
      ];
    }

    function parityBits(payload) {
      let parity = "";
      for (let index = 0; index < PARITY_BITS; index += 1) {
        let bit = 0;
        parityGroup(index).forEach((payloadIndex) => {
          if (payload[payloadIndex] === "1") bit ^= 1;
        });
        parity += String(bit);
      }
      return parity;
    }

    function encodedPackets() {
      const payload = messageBits();
      const codeword = (payload + parityBits(payload)).padEnd(CODEWORD_BITS, "0");
      const packets = [];
      for (let offset = 0; offset < codeword.length; offset += PACKET_BITS) {
        packets.push(codeword.slice(offset, offset + PACKET_BITS));
      }
      return [...PREAMBLE, ...packets];
    }

    function render(nextBits) {
      bits = normalize(nextBits);
      binaryOut.textContent = bits;

      leds.forEach((led) => {
        const bit = Number(led.dataset.bit);
        led.dataset.on = bits[4 - bit];
      });

    }

    function step() {
      if (timer === null && txPackets.length === 0) {
        txPackets = encodedPackets();
      }
      if (nextIndex >= txPackets.length) {
        completeTransmission();
        return;
      }

      render(txPackets[nextIndex]);
      nextIndex += 1;
    }

    function start() {
      if (timer !== null) return;
      txPackets = encodedPackets();
      nextIndex = 0;
      step();
      timer = window.setInterval(step, 1000 / Math.max(1, Math.min(30, Number(fps.value) || 1)));
      play.textContent = "Stop";
    }

    function stop() {
      if (timer !== null) {
        window.clearInterval(timer);
        timer = null;
      }
      play.textContent = "Start";
      finishTransmission();
    }

    function completeTransmission() {
      if (timer !== null) {
        window.clearInterval(timer);
        timer = null;
      }
      play.textContent = "Start";
      finishTransmission();
    }

    function finishTransmission() {
      nextIndex = 0;
      txPackets = [];
      render("00000");
    }

    function renderMessageGrid() {
      messageGrid.replaceChildren();
      pixels.forEach((on, index) => {
        const cell = document.createElement("button");
        cell.className = "pixel";
        cell.type = "button";
        cell.dataset.on = on ? "1" : "0";
        cell.addEventListener("click", () => {
          pixels[index] = !pixels[index];
          cell.dataset.on = pixels[index] ? "1" : "0";
        });
        messageGrid.append(cell);
      });
    }

    play.addEventListener("click", () => timer === null ? start() : stop());
    fps.addEventListener("input", () => {
      if (timer !== null) {
        stop();
        start();
      }
    });

    renderMessageGrid();
    render(bits);
  </script>
</body>
</html>
