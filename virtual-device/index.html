<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>5-bit optical device</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #000;
      --fg: #f6f7f9;
      --muted: #a8adb7;
      --line: #2f343c;
      --matrix-bg-start: rgba(255,255,255,0.045);
      --matrix-bg-end: rgba(255,255,255,0.012);
      --matrix-inset: rgba(255,255,255,0.02);
      --kbd-fg: #b7bcc5;
      --kbd-bg: #090a0c;
      --kbd-border: #343941;
      --kbd-border-bottom: #242830;
      --blue: #67a8ff;
      --blue-off: rgba(103,168,255,0.11);
      --blue-glow: rgba(103,168,255,0.54);
      --arrow: #626975;
      --led: 3mm;
      --gap: 2.5mm;
      --marker: 4mm;
      --marker-gap: 4mm;
      --pad-x: 7mm;
      --pad-y: 7mm;
      --step: calc(var(--led) + var(--gap));
      --target-width: calc(var(--pad-x) * 2 + var(--marker) * 2 + var(--marker-gap) * 2 + var(--led) * 5 + var(--gap) * 4);
      --target-height: calc(var(--pad-y) * 2 + var(--marker));
      --led-y: calc(var(--target-height) / 2);
      --start-marker-x: calc(var(--pad-x) + var(--marker) / 2);
      --first-led-x: calc(var(--pad-x) + var(--marker) + var(--marker-gap) + var(--led) / 2);
      --end-marker-x: calc(var(--first-led-x) + var(--step) * 4 + var(--led) / 2 + var(--marker-gap) + var(--marker) / 2);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 320px;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
      font-weight: 680;
      letter-spacing: 0;
    }

    .stage {
      display: grid;
      place-items: center;
      min-width: 0;
      padding: 32px;
    }

    .panel {
      min-height: 100vh;
      padding: 28px;
      border-left: 1px solid var(--line);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .sub {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .controls {
      display: grid;
      gap: 16px;
    }

    .actions {
      display: grid;
      gap: 10px;
    }

    .device {
      width: var(--target-width);
      height: var(--target-height);
      position: relative;
      flex: none;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, var(--matrix-bg-start), var(--matrix-bg-end));
      border-radius: 8px;
      box-shadow: inset 0 0 0 1px var(--matrix-inset);
    }

    .led {
      width: var(--led);
      height: var(--led);
      position: absolute;
      left: calc(var(--first-led-x) + var(--index) * var(--step));
      top: var(--led-y);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: var(--blue);
      box-shadow:
        0 0 2.2mm var(--blue-glow),
        0 0 5.6mm rgba(103,168,255,0.24);
      z-index: 2;
    }

    .led[data-on="0"] {
      background: var(--blue-off);
      box-shadow: none;
    }

    .marker.start {
      width: calc(var(--led) + 0.45mm);
      height: calc(var(--led) + 0.45mm);
      position: absolute;
      left: var(--start-marker-x);
      top: var(--led-y);
      transform: translate(-50%, -50%);
      background: var(--arrow);
      border-radius: 0.2mm;
      z-index: 1;
    }

    .marker.end {
      width: calc(var(--led) + 2mm);
      height: calc(var(--led) + 2mm);
      position: absolute;
      left: var(--end-marker-x);
      top: var(--led-y);
      transform: translate(-50%, -50%);
      z-index: 1;
      fill: var(--arrow);
    }

    button {
      height: 38px;
      border: 1px solid var(--kbd-border);
      border-bottom-color: var(--kbd-border-bottom);
      border-radius: 6px;
      background: var(--kbd-bg);
      color: var(--kbd-fg);
      font: inherit;
      padding: 0 12px;
      font-weight: 650;
      cursor: pointer;
    }

    button:disabled {
      cursor: default;
      opacity: 0.55;
    }

    .rate-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .rate-button[aria-pressed="true"] {
      border-color: #7c8490;
      background: #181b20;
      color: var(--fg);
    }

    .compact {
      display: grid;
      gap: 8px;
    }

    .compact label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }

    .primary {
      border-color: var(--kbd-border);
      background: var(--kbd-bg);
      color: var(--fg);
    }

    .message-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 4px;
      width: min(100%, 216px);
    }

    .pixel {
      aspect-ratio: 1;
      border: 1px solid var(--kbd-border);
      border-radius: 3px;
      background: #07080a;
      cursor: crosshair;
    }

    .pixel[data-on="1"] {
      background: var(--fg);
    }

    @media (max-width: 760px) {
      main {
        grid-template-columns: 1fr;
      }

      .stage {
        min-height: 58vh;
      }

      .panel {
        min-height: auto;
        border-left: 0;
        border-top: 1px solid var(--line);
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="stage" aria-label="virtual optical target">
      <div class="device" aria-label="5-bit LED grid">
        <i class="marker start" aria-hidden="true"></i>
        <i class="led" data-bit="4" data-on="1" style="--index: 0"></i>
        <i class="led" data-bit="3" data-on="0" style="--index: 1"></i>
        <i class="led" data-bit="2" data-on="1" style="--index: 2"></i>
        <i class="led" data-bit="1" data-on="0" style="--index: 3"></i>
        <i class="led" data-bit="0" data-on="1" style="--index: 4"></i>
        <svg class="marker end" viewBox="0 0 12 12" aria-hidden="true">
          <polygon points="6 2 10 10 2 10"></polygon>
        </svg>
      </div>
    </section>

    <aside class="panel">
      <header>
        <h1>Virtual Device</h1>
      </header>

      <section class="controls">
        <div class="compact">
          <label>rate</label>
          <div class="rate-buttons" role="group" aria-label="rate">
            <button class="rate-button" type="button" data-rate="2" aria-pressed="false">2</button>
            <button class="rate-button" type="button" data-rate="4" aria-pressed="false">4</button>
            <button class="rate-button" type="button" data-rate="8" aria-pressed="true">8</button>
          </div>
        </div>

        <div class="actions">
          <button class="primary" id="play" type="button">Start</button>
        </div>

        <div class="compact">
          <label>message</label>
          <div class="message-grid" id="messageGrid" aria-label="6 by 6 binary message"></div>
        </div>
      </section>

      <output id="binaryOut" hidden>00000</output>
    </aside>
  </main>

  <script>
    const leds = [...document.querySelectorAll(".led")];
    const play = document.getElementById("play");
    const rateButtons = [...document.querySelectorAll(".rate-button")];
    const messageGrid = document.getElementById("messageGrid");
    const binaryOut = document.getElementById("binaryOut");

    // ===== FOUNTAIN CODE CONFIGURATION =====
    const PREAMBLE = ["00000", "01010", "10101", "11111"];
    const MESSAGE_BITS = 36;
    const PARITY_BITS = 24;
    const CODEWORD_BITS = MESSAGE_BITS + PARITY_BITS; // 60 bits total from finite LDPC
    const PACKET_BITS = 5;
    const MEASUREMENTS_PER_PACKET = 5; // 5 measurements per transmitted packet
    const SEED1 = 0x12345678; // LDGM RNG seed

    // Finite LDPC precode parity check groups
    const PARITY_GROUPS = [
      [15, 34, 8, 23, 30, 20, 18, 2],
      [0, 5, 26, 22, 32, 19, 7, 9],
      [17, 35, 33, 24, 28, 11, 10, 25],
      [27, 9, 14, 12, 6, 16, 13, 4],
      [7, 16, 3, 1, 20, 31, 24, 15],
      [4, 27, 21, 18, 0, 1, 29, 28],
      [34, 26, 12, 2, 16, 10, 33, 29],
      [11, 19, 13, 8, 25, 21, 14, 1],
      [30, 0, 23, 31, 24, 6, 32, 35],
      [13, 17, 28, 12, 31, 3, 22, 23],
      [21, 10, 9, 20, 5, 25, 29, 3],
      [17, 32, 20, 14, 18, 6, 33, 2],
      [18, 10, 22, 6, 11, 4, 26, 3],
      [15, 12, 5, 4, 19, 24, 35, 34],
      [3, 8, 35, 26, 7, 27, 25, 23],
      [5, 25, 31, 32, 27, 11, 1, 30],
      [29, 22, 0, 17, 33, 8, 30, 14],
      [28, 15, 7, 31, 2, 8, 11, 9],
      [27, 19, 34, 17, 20, 21, 0, 6],
      [5, 7, 30, 10, 13, 6, 1, 23],
      [5, 28, 16, 12, 22, 2, 21, 32],
      [33, 13, 26, 4, 25, 15, 24, 29],
      [10, 19, 32, 18, 3, 15, 35, 16],
      [31, 13, 21, 17, 35, 34, 9, 14],
    ];

    const DEFAULT_MESSAGE = [
      "110011",
      "110011",
      "000000",
      "001100",
      "011110",
      "010010",
    ].join("");
    const pixels = [...DEFAULT_MESSAGE].map((bit) => bit === "1");

    // ===== UTILITIES =====

    // Simple linear congruential RNG
    class SeededRNG {
      constructor(seed) {
        this.state = seed >>> 0; // Ensure 32-bit unsigned
      }

      next() {
        this.state = (Math.imul(this.state, 1103515245) + 12345) >>> 0;
        return this.state;
      }

      nextBit() {
        return (this.next() >>> 16) & 1;
      }

      // Irregular LDGM degree distribution. Degree-1 rows bootstrap soft BP from zero priors.
      nextNeighbors(maxIndex) {
        const r = this.next() >>> 0;
        let degree = 3;

        if (r < 858993459) degree = 1;
        else if (r < 2147483648) degree = 2;
        else if (r < 3221225472) degree = 3;
        else if (r < 3865470566) degree = 4;
        else if (r < 4166118277) degree = 5;
        else degree = 6;

        const neighbors = [];
        while (neighbors.length < degree) {
          const candidate = this.next() % maxIndex;
          if (!neighbors.includes(candidate)) {
            neighbors.push(candidate);
          }
        }
        return neighbors;
      }
    }

    // Encode message -> 60-bit codeword via finite LDPC precode
    function finiteParityBits(payload) {
      let parity = "";
      for (let index = 0; index < PARITY_BITS; index += 1) {
        let bit = 0;
        PARITY_GROUPS[index].forEach((payloadIndex) => {
          if (payload[payloadIndex] === "1") bit ^= 1;
        });
        parity += String(bit);
      }
      return parity;
    }

    function encodeLDPCPrecode(messageBits) {
      // Encode 36-bit message -> 60-bit codeword (with padding)
      const codeword = (messageBits + finiteParityBits(messageBits)).padEnd(CODEWORD_BITS, "0");
      return codeword.split("").map((c) => c === "1" ? 1 : 0);
    }

    function mixMeasurementSeed(measurementIndex) {
      let x = (SEED1 + Math.imul(measurementIndex >>> 0, 0x9E3779B9)) >>> 0;
      x = Math.imul((x ^ (x >>> 16)) >>> 0, 0x85EBCA6B) >>> 0;
      x = Math.imul((x ^ (x >>> 13)) >>> 0, 0xC2B2AE35) >>> 0;
      return (x ^ (x >>> 16)) >>> 0;
    }

    function measurementNeighbors(measurementIndex) {
      return new SeededRNG(mixMeasurementSeed(measurementIndex)).nextNeighbors(CODEWORD_BITS);
    }

    // ===== STATE & TRANSMISSION =====

    let bits = "00000";
    let timer = null;
    let nextTickAtMs = 0;
    let nextPacketIndex = 0; // Absolute packet index (includes preamble)
    let codeword = null; // Current encoded codeword (60-bit array)
    let rate = 8;

    function normalize(value) {
      return String(value).replace(/[^01]/g, "").padEnd(5, "0").slice(0, 5);
    }

    function messageBits() {
      return pixels.map((on) => on ? "1" : "0").join("");
    }

    function render(nextBits) {
      bits = normalize(nextBits);
      binaryOut.textContent = bits;

      leds.forEach((led) => {
        const bit = Number(led.dataset.bit);
        led.dataset.on = bits[4 - bit];
      });
    }

    function getNextPacketBits() {
      if (nextPacketIndex < PREAMBLE.length) {
        // Preamble phase
        return PREAMBLE[nextPacketIndex].split("").map((c) => Number(c));
      }

      // Fountain payload phase: generate continuous LDGM measurements
      if (codeword === null) {
        codeword = encodeLDPCPrecode(messageBits());
      }

      const payloadPacketIndex = nextPacketIndex - PREAMBLE.length;
      const packetMeasurements = [];
      for (let i = 0; i < MEASUREMENTS_PER_PACKET; i++) {
        const neighbors = measurementNeighbors(payloadPacketIndex * MEASUREMENTS_PER_PACKET + i);
        let measurement = 0;
        neighbors.forEach((index) => {
          measurement ^= codeword[index];
        });
        packetMeasurements.push(measurement);
      }

      return packetMeasurements;
    }

    function step() {
      const packetBits = getNextPacketBits();
      render(packetBits.map((b) => String(b)).join(""));
      nextPacketIndex += 1;
    }

    function scheduleNextStep() {
      if (timer === null) return;
      nextTickAtMs += 1000 / rate;
      const delayMs = Math.max(0, nextTickAtMs - performance.now());
      timer = window.setTimeout(tick, delayMs);
    }

    function tick() {
      if (timer === null) return;
      step();
      scheduleNextStep();
    }

    function setRate(nextRate) {
      if (timer !== null) return;
      rate = nextRate;
      rateButtons.forEach((button) => {
        button.setAttribute("aria-pressed", button.dataset.rate === String(rate) ? "true" : "false");
      });
    }

    function setRateLocked(locked) {
      rateButtons.forEach((button) => {
        button.disabled = locked;
      });
    }

    function start() {
      if (timer !== null) return;
      nextPacketIndex = 0;
      codeword = null;
      nextTickAtMs = performance.now();
      timer = 0;
      step();
      scheduleNextStep();
      play.textContent = "Stop";
      setRateLocked(true);
    }

    function stop() {
      if (timer !== null) {
        window.clearTimeout(timer);
        timer = null;
      }
      play.textContent = "Start";
      setRateLocked(false);
      render("00000");
    }

    function renderMessageGrid() {
      messageGrid.replaceChildren();
      pixels.forEach((on, index) => {
        const cell = document.createElement("button");
        cell.className = "pixel";
        cell.type = "button";
        cell.dataset.on = on ? "1" : "0";
        cell.addEventListener("click", () => {
          pixels[index] = !pixels[index];
          cell.dataset.on = pixels[index] ? "1" : "0";
        });
        messageGrid.append(cell);
      });
    }

    play.addEventListener("click", () => timer === null ? start() : stop());
    rateButtons.forEach((button) => {
      button.addEventListener("click", () => setRate(Number(button.dataset.rate)));
    });

    setRate(rate);
    renderMessageGrid();
    render(bits);
  </script>
</body>
</html>
