<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>5-bit optical device</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #000;
      --fg: #f6f7f9;
      --muted: #a8adb7;
      --line: #2f343c;
      --matrix-bg-start: rgba(255,255,255,0.045);
      --matrix-bg-end: rgba(255,255,255,0.012);
      --matrix-inset: rgba(255,255,255,0.02);
      --kbd-fg: #b7bcc5;
      --kbd-bg: #090a0c;
      --kbd-border: #343941;
      --kbd-border-bottom: #242830;
      --blue: #67a8ff;
      --blue-off: rgba(103,168,255,0.11);
      --blue-glow: rgba(103,168,255,0.54);
      --arrow: #626975;
      --led: 3mm;
      --gap: 2.2mm;
      --step: calc(var(--led) + var(--gap));
      --pad: 7mm;
      --grid: calc(var(--led) + var(--step) * 2);
      --target-size: calc(var(--grid) + var(--pad) * 2);
      --center: calc(var(--pad) + var(--step) + var(--led) / 2);
      --chevron-offset: 4.65mm;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 320px;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
      font-weight: 680;
      letter-spacing: 0;
    }

    .stage {
      display: grid;
      place-items: center;
      min-width: 0;
      padding: 32px;
    }

    .panel {
      min-height: 100vh;
      padding: 28px;
      border-left: 1px solid var(--line);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      gap: 24px;
      pointer-events: none;
    }

    .sub {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .controls {
      display: grid;
      gap: 16px;
      pointer-events: auto;
    }

    .device {
      width: var(--target-size);
      height: var(--target-size);
      position: relative;
      flex: none;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, var(--matrix-bg-start), var(--matrix-bg-end));
      border-radius: 8px;
      box-shadow: inset 0 0 0 1px var(--matrix-inset);
    }

    .led {
      width: var(--led);
      height: var(--led);
      position: absolute;
      left: calc(var(--pad) + var(--col) * var(--step) + var(--led) / 2);
      top: calc(var(--pad) + var(--row) * var(--step) + var(--led) / 2);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: var(--blue);
      box-shadow:
        0 0 2.2mm var(--blue-glow),
        0 0 5.6mm rgba(103,168,255,0.24);
      z-index: 2;
    }

    .led[data-on="0"] {
      background: var(--blue-off);
      box-shadow: none;
    }

    .arrow {
      position: absolute;
      width: 4.1mm;
      height: 4.1mm;
      overflow: visible;
      fill: none;
      stroke: var(--arrow);
      stroke-width: 1.55;
      stroke-linecap: round;
      stroke-linejoin: round;
      z-index: 3;
    }

    .arrow.right {
      left: calc(var(--center) - var(--chevron-offset));
      top: var(--center);
      transform: translate(-50%, -50%);
    }

    .arrow.left {
      left: calc(var(--center) + var(--chevron-offset));
      top: var(--center);
      transform: translate(-50%, -50%) rotate(180deg);
    }

    .arrow.up {
      left: var(--center);
      top: calc(var(--center) + var(--chevron-offset));
      transform: translate(-50%, -50%) rotate(270deg);
    }

    .arrow.down {
      left: var(--center);
      top: calc(var(--center) - var(--chevron-offset));
      transform: translate(-50%, -50%) rotate(90deg);
    }

    .marker {
      width: calc(var(--led) + 1mm);
      height: calc(var(--led) + 1mm);
      position: absolute;
      left: calc(var(--pad) + var(--led) / 2);
      top: calc(var(--pad) + var(--led) / 2);
      transform: translate(-50%, -50%);
      background: var(--arrow);
      border-radius: 0.2mm;
      z-index: 1;
    }

    button,
    input {
      height: 38px;
      border: 1px solid var(--kbd-border);
      border-bottom-color: var(--kbd-border-bottom);
      border-radius: 6px;
      background: var(--kbd-bg);
      color: var(--kbd-fg);
      font: inherit;
    }

    button {
      padding: 0 12px;
      font-weight: 650;
      cursor: pointer;
    }

    input {
      width: 100%;
      padding: 0 10px;
    }

    .compact {
      display: grid;
      gap: 8px;
    }

    .compact label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }

    .primary {
      border-color: var(--kbd-border);
      background: var(--kbd-bg);
      color: var(--fg);
    }

    @media (max-width: 760px) {
      main {
        grid-template-columns: 1fr;
      }

      .stage {
        min-height: 58vh;
      }

      .panel {
        min-height: auto;
        border-left: 0;
        border-top: 1px solid var(--line);
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="stage" aria-label="virtual optical target">
      <div class="device" aria-label="5-bit LED grid">
        <i class="marker" aria-hidden="true"></i>
        <i class="led" data-bit="4" data-on="1" style="--col: 0; --row: 0"></i>
        <i class="led" data-bit="3" data-on="0" style="--col: 2; --row: 0"></i>
        <i class="led" data-bit="2" data-on="1" style="--col: 1; --row: 1"></i>
        <i class="led" data-bit="1" data-on="0" style="--col: 0; --row: 2"></i>
        <i class="led" data-bit="0" data-on="1" style="--col: 2; --row: 2"></i>
        <svg class="arrow down" viewBox="0 0 12 12" aria-hidden="true">
          <polyline points="4 3 8 6 4 9"></polyline>
        </svg>
        <svg class="arrow right" viewBox="0 0 12 12" aria-hidden="true">
          <polyline points="4 3 8 6 4 9"></polyline>
        </svg>
        <svg class="arrow left" viewBox="0 0 12 12" aria-hidden="true">
          <polyline points="4 3 8 6 4 9"></polyline>
        </svg>
        <svg class="arrow up" viewBox="0 0 12 12" aria-hidden="true">
          <polyline points="4 3 8 6 4 9"></polyline>
        </svg>
      </div>
    </section>

    <aside class="panel">
      <header>
        <h1>Virtual Device</h1>
      </header>

      <section class="controls">
        <div class="compact">
          <label for="packet">packet</label>
          <input id="packet" value="10101" maxlength="5" inputmode="numeric" pattern="[01]{5}">
        </div>

        <div class="compact">
          <label for="sequence">sequence</label>
          <input id="sequence" value="00000 10000 01000 00100 00010 00001 11111">
        </div>

        <div class="compact">
          <label for="fps">rate</label>
          <input id="fps" type="number" min="1" max="30" value="8">
        </div>

        <button class="primary" id="play" type="button">Start</button>
        <button id="step" type="button">Step</button>
      </section>

      <output id="binaryOut" hidden>10101</output>
      <output id="decimalOut" hidden>21</output>
    </aside>
  </main>

  <script>
    const leds = [...document.querySelectorAll(".led")];
    const packet = document.getElementById("packet");
    const sequence = document.getElementById("sequence");
    const fps = document.getElementById("fps");
    const play = document.getElementById("play");
    const stepButton = document.getElementById("step");
    const binaryOut = document.getElementById("binaryOut");
    const decimalOut = document.getElementById("decimalOut");

    let bits = "10101";
    let timer = null;
    let nextIndex = 0;

    function normalize(value) {
      return String(value).replace(/[^01]/g, "").padEnd(5, "0").slice(0, 5);
    }

    function packets() {
      return sequence.value
        .split(/[\s,;|]+/)
        .filter(Boolean)
        .map(normalize);
    }

    function render(nextBits) {
      bits = normalize(nextBits);
      packet.value = bits;
      binaryOut.textContent = bits;
      decimalOut.textContent = String(Number.parseInt(bits, 2));

      leds.forEach((led) => {
        const bit = Number(led.dataset.bit);
        led.dataset.on = bits[4 - bit];
      });

    }

    function step() {
      const list = packets();
      if (list.length === 0) {
        nextIndex = 0;
        render("00000");
        return;
      }

      render(list[nextIndex % list.length]);
      nextIndex = (nextIndex + 1) % list.length;
    }

    function start() {
      if (timer !== null) return;
      step();
      timer = window.setInterval(step, 1000 / Math.max(1, Math.min(30, Number(fps.value) || 1)));
      play.textContent = "Stop";
    }

    function stop() {
      if (timer === null) return;
      window.clearInterval(timer);
      timer = null;
      play.textContent = "Start";
    }

    packet.addEventListener("input", () => render(packet.value));
    sequence.addEventListener("input", () => {
      nextIndex = 0;
    });
    stepButton.addEventListener("click", step);
    play.addEventListener("click", () => timer === null ? start() : stop());
    fps.addEventListener("input", () => {
      if (timer !== null) {
        stop();
        start();
      }
    });

    render(bits);
  </script>
</body>
</html>
